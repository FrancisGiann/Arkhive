# Modified for the private ReadingApp prototype; see READINGAPP-PROTOTYPE.md.
kotlin.code.style=official

# Configuration should be synced with [/gradle/build-logic/gradle.properties]
org.gradle.caching=true
org.gradle.isolated-projects=true
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.tooling.parallel=true

# Private fork: never enable upstream telemetry/update endpoints by distribution defaults.
include-telemetry=false
enable-updater=false
org.gradle.workers.max=2
